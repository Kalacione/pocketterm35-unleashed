# Wi-Fi du Pi (brcmfmac). Avec deux bornes du même nom, le roaming fait par le
# firmware échoue (reason=7) et son WPA3 aussi (External authentication failed) :
# chaque échec fige les ssh. roamoff laisse le roaming à wpa_supplicant,
# feature_disable coupe le WPA3 du firmware. Prix : plus de réseau en WPA3 seul.
options brcmfmac roamoff=1 feature_disable=0x82000
