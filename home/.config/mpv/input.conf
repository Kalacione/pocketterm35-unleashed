# Boutons du PocketTerm en mode Boutons : A = Entrée, X = Tab, Y = F10.
# Le D-pad garde les flèches de mpv (avance et recul).
ENTER       cycle pause
TAB         script-binding uosc/toggle-ui
F10         script-binding uosc/menu
# Au doigt : toucher la vidéo met en pause, B (clic droit en mode Souris) ouvre le menu.
MBTN_LEFT   cycle pause
MBTN_RIGHT  script-binding uosc/menu
