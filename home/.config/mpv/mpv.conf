# uosc remplace l'interface d'origine de mpv (réglages conseillés par uosc).
osc=no
osd-bar=no
border=no
osd-font='JetBrains Mono'

# Un profil par app (--profile dans apps.toml) : chacune sa médiathèque,
# où uosc commence à parcourir et que pt35-home.lua propose à l'accueil.
[pt35-music]
script-opts-append=uosc-default_directory=~/Music

[pt35-video]
script-opts-append=uosc-default_directory=~/Videos
