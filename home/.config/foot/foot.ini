# PocketTerm Phosphore (DESIGN.md) par-dessus le foot.ini de PocketTerm35-OS.
include=/usr/share/pt35-desktop/foot/foot.ini
# 10.5 pt = 14 px (dpi-aware=no d'upstream) : un cran au-dessus des 13 px.
font=JetBrains Mono:size=10.5

[cursor]
color=0b0f0d 63e6a4

[colors]
background=0b0f0d
foreground=63e6a4
selection-background=e6fff2
selection-foreground=06110b
regular0=121a16
regular1=ff6e6e
regular2=63e6a4
regular3=ffa94d
regular4=4fd1d9
regular6=4fd1d9
regular7=d4ffe9
bright0=5e8f78
