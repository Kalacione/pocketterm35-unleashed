# PocketTerm Phosphore (DESIGN.md), par-dessus le theme.toml de PocketTerm35-OS 0.4.2.
# Seules les clés changées sont ici. Ce fichier passe devant Paramètres > Apparence :
# les palettes choisies là-bas ne changent plus les couleurs tant qu'il est lié.

[color]
background      = "#0b0f0d"
background_alt  = "#121a16"   # surface
tile            = "#1c2a23"   # tuiles et panneaux de l'accueil (fork u10) : assez clair pour que l'opacité se voie
foreground      = "#63e6a4"   # phosphore doux
muted           = "#5e8f78"
# pt35-menu peint la ligne sélectionnée en `accent` : blanc léger, texte sombre.
accent          = "#e6fff2"
accent_fg       = "#06110b"
warning         = "#ffa94d"   # danger, toujours en fond plein
critical        = "#ff6e6e"   # erreur, toujours en fond plein
ok              = "#63e6a4"
border          = "#24382e"   # line
button_a        = "#63e6a4"
button_b        = "#ff6e6e"
button_x        = "#4fd1d9"
button_y        = "#ffa94d"
button_neutral  = "#24382e"

# JetBrains Mono liée dans /usr/share/fonts/TTF par install.sh (PT35-OS n'a pas
# fontconfig). VT323 vient de ~/.local/share/fonts (fork 0.4.2+u5) : les horloges.
[font]
family           = "JetBrains Mono"
family_bold      = "JetBrains Mono Bold"
family_mono      = "JetBrains Mono"
family_mono_bold = "JetBrains Mono Bold"
family_display   = "VT323"

# Barre plus haute (34 chez upstream). Multiple de scanline_period : les lignes
# de la barre tombent alors dans le prolongement de celles du menu.
[bar]
height          = 40
clock_size      = 28.0        # horloge en VT323

# L'accueil de la charte (PT35-OS 0.4.2+u4, notre fork) : widgets à gauche,
# épingles en grille 3x3 à droite. Y ouvre Toutes les apps, où Y épingle.
[menu]
radius          = 0           # angles droits
launcher_columns = 3
launcher_home   = true
hint_frames     = true        # légende : touche carrée, action encadrée (fork u6)
row_frames      = true        # icônes encadrées, Réglages rapides en liste, interrupteurs ON/OFF (fork u9)
# tile_opacity n'est pas ici : ce fichier passerait devant le curseur Tuiles
# des Réglages rapides. install.sh le pose à 85 % dans appearance.toml.

# Tabler Icons en vert pour le lanceur (tools/icons.sh), Papirus pour le reste.
[icons]
theme           = "Phosphore"
glow            = 4           # halo flou sous les icônes de la grille, en px

# Scanlines CRT comme la maquette : une ligne sur quatre 25 % plus sombre
# (barre, menu, apps). Une sur deux à 15 % ne se voyait pas sur l'écran 3,5".
[effects]
scanlines       = 25
scanline_period = 4
glow            = 3           # halo de l'horloge de l'accueil, en px
# Balayage CRT, menu ouvert seulement (jamais sur une vidéo) : une bande
# lumineuse descend l'écran toutes les 8 à 13 s (fork u6).
sweep           = 8
sweep_jitter    = 5
sweep_strength  = 8           # %
# Pluie d'hexa derrière l'accueil (fork u19) : une ligne par tick du menu,
# 4 par seconde, tête à 40 % du phosphore. Visible dans les marges, à peine
# sous les tuiles (85 %). 0 la coupe.
rain            = 40          # %
