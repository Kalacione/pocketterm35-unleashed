# Seules les clés qu'on change ; PT35-OS fusionne le reste.

# Musique sur mpv + uosc, comme Vidéo : une seule interface pour les deux.
# Un app_id à part, sinon la barre confondrait Musique et Vidéo.
# --idle=yes : pseudo-gui met idle=once, et mpv se fermait sur un ~/Music vide ou absent.
[app.music]
icon  = "multimedia-audio-player"
exec  = "sh -c 'mpv --player-operation-mode=pseudo-gui --force-window=yes --idle=yes --profile=pt35-music --wayland-app-id=pt35-music \"${HOME}/Music\"'"
match = { app_id = "pt35-music", class = "pt35-music" }

# Profil mpv pt35-video : sa médiathèque est ~/Videos (voir mpv.conf).
[app.video]
exec = "mpv --player-operation-mode=pseudo-gui --idle=yes --profile=pt35-video"

# Le Terminal dans tmux, pour sa barre du bas (~/.config/tmux/tmux.conf).
[app.terminal]
exec = "foot tmux new-session pt35-hello"

# Files reste yazi : vfs.toml (hôtes SSH) refait depuis ~/.ssh/config à chaque ouverture.
[app.files]
exec = "foot -a pt35-files sh -c '\"$HOME/.local/bin/pt35-yazi-vfs\"; exec yazi'"
