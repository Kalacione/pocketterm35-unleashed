# Barre du bas du terminal, charte Phosphore (DESIGN.md). Lancé par la tuile
# Terminal et Super+Entrée : `foot tmux new-session pt35-hello`.

# foot gère le 24 bits : sans ça, tmux réduit les couleurs à 256.
set -g default-terminal "tmux-256color"
set -as terminal-features ",foot*:RGB"
set -sg escape-time 10
set -g history-limit 5000

# Fermer la fenêtre (L) ferme la session : pas de shell orphelin en fond.
set -g destroy-unattached on

# Souris et tactile : la molette (X/Y en mode souris) fait défiler
# l'historique, un glisser copie dans le presse-papiers de foot (OSC 52).
# Maj + glisser garde la sélection native de foot.
set -g mouse on
set -s set-clipboard on

# Le titre de la fenêtre suit la commande en cours (barre du haut, bascule).
set -g set-titles on
set -g set-titles-string "#{pane_current_command}"

set -g base-index 1
setw -g pane-base-index 1

# Bandeau plein vert, texte sombre : lisible sans distinguer les teintes.
# La fenêtre active se reconnaît à ses crochets, pas à sa couleur.
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#63e6a4,fg=#06110b"
set -g status-left " #[bold]#{host_short}#[nobold] · #{window_width}×#{window_height} "
set -g status-left-length 40
set -g status-right "Start menu · R mouse "
set -g status-right-length 40
setw -g window-status-format " #I #W "
setw -g window-status-current-format "#[bold][#I #W]"
setw -g window-status-separator ""

# Invite de commande, copie et sélection : blanc léger de la charte.
set -g message-style "bg=#d4ffe9,fg=#06110b"
set -g message-command-style "bg=#d4ffe9,fg=#06110b"
setw -g mode-style "bg=#e6fff2,fg=#06110b"
set -g pane-border-style "fg=#24382e"
set -g pane-active-border-style "fg=#63e6a4"
